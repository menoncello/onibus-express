server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AD-11: proxy reverso para a Api, sem CORS — nunca existe segunda origem. O prefixo /api
    # é removido antes de encaminhar, então o frontend nunca conhece a URL absoluta da Api.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai em index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
