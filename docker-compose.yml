services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onibus}
      POSTGRES_USER: ${POSTGRES_USER:-onibus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onibus_local_dev}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-onibus} -d ${POSTGRES_DB:-onibus}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 gerencia o subdiretório versionado por conta própria; o mount deve ser no
      # diretório pai, não em .../data (https://github.com/docker-library/postgres/pull/1259).
      - db-data:/var/lib/postgresql

  api:
    build:
      context: ./backend
      dockerfile: OniBus.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-onibus};Username=${POSTGRES_USER:-onibus};Password=${POSTGRES_PASSWORD:-onibus_local_dev}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Reusa GET /rotas como probe — sem adicionar dependência nova, a imagem base já traz
      # wget (busybox). Só fica "healthy" depois que migração + seed terminam e o endpoint
      # responde, o que é exatamente o que o Nginx precisa esperar.
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8080/rotas || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
